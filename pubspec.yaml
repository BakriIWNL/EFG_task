name: efg_currency_converter
description: Currency converter with live exchange rates and on-device history.

publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  animate_do: ^5.1.0
  bloc: ^9.2.1
  connectivity_plus: ^6.1.0
  dartz: ^0.10.1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^7.7.0
  go_router: ^14.1.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  shared_preferences: ^2.2.3
  skeletonizer: ^3.0.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.4
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
